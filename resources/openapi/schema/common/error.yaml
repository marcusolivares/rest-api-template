ErrorResponse:
  type: object
  description: Standard response envelope returned by all endpoints on failure.
  properties:
    error-code:
      type: string
      description: Machine-readable error code.
      example: VALUE1_OUT_OF_RANGE
    error-message:
      type: string
      description: Human-readable description of the error.
      example: "value1 must be in range [-1000, 1000]"
